<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather</h1>
      <div class="search">
        <input type="text" placeholder="Add City name" class="search-input" />
        <button class="search-btn"></button>
      </div>
      <div class="weather-info">
        <div class="weather-icon">
          <img src="assets/clear.png" />
          <h1 class="weather-city">HCM</h1>
        </div>

        <div class="weather-detail">
          <div class="humidity">
            <img src="assets/humidity.png" />
            <h2 class="weather-humidity">20%</h2>
          </div>
          <div class="wind">
            <img src="assets/wind.png" />
            <h2 class="weather-wind">20 km/h</h2>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
